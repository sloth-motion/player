name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # Needed for provenance attestations.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Bootstrap: the package does not exist yet, so trusted publishing
      # cannot be configured. Once @sloth-motion-labs/player exists, add a
      # trusted publisher on npm and delete the NODE_AUTH_TOKEN line below.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
